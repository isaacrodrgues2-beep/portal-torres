<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064630"><title>Portal Torres | Barbearia</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20342d;background:#f6f3ed}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#064630;color:#f6ecdb;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:2px}.brand small{display:block;font:10px system-ui;letter-spacing:3px;color:#d6bd84;margin-top:4px}.pill{border:1px solid #b99d66;border-radius:40px;padding:7px 12px;color:#f7e6c6;font-size:12px}main{max-width:1150px;margin:auto;padding:28px 18px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}nav{display:flex;flex-direction:column;gap:8px}nav button{border:0;background:transparent;text-align:left;padding:13px 16px;border-radius:12px;color:#244436}nav button.active{background:#064630;color:white}.card{background:#fff;border:1px solid #e9e4d9;border-radius:18px;padding:22px;box-shadow:0 4px 22px #132b1710}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f8f6f1;padding:16px;border-radius:14px}.metric strong{font-size:25px;display:block;color:#064630}.muted{color:#77847b;font-size:13px}.progress{height:13px;background:#e7e7dd;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#168258;transition:width .3s}.primary{background:#064630;border:0;border-radius:11px;color:white;padding:12px 18px}.secondary{background:white;border:1px solid #d4d9ce;border-radius:11px;padding:11px 15px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field input,.field select{border:1px solid #d8ddd4;border-radius:10px;padding:12px;background:white;width:100%}.login{max-width:420px;margin:10vh auto}.hidden{display:none!important}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font:30px Georgia,serif;color:#064630;margin:0 0 8px}h2{font:23px Georgia,serif;color:#064630}h3{margin:0 0 10px}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #ecece6;font-size:14px}a{color:#075c3e}.notice{background:#fff8e9;padding:12px;border-left:3px solid #c4a263;border-radius:8px;margin:14px 0}.list{display:grid;gap:12px}.item{padding:14px;border:1px solid #e6e8e1;border-radius:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.tag{font-size:11px;color:#136644;background:#e5f4e9;border-radius:30px;padding:5px 9px}#toast{position:fixed;bottom:20px;right:20px;background:#143b2e;color:white;padding:12px 18px;border-radius:10px;display:none;max-width:90vw}#toast.show{display:block}@media(max-width:780px){.layout{display:block}nav{flex-direction:row;overflow:auto;margin-bottom:18px}nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}main{padding:18px 12px}.card{padding:16px}.brand{font-size:19px}}
</style></head><body><header><div class="brand">TORRES<small>BARBEARIA · PORTAL DA EQUIPE</small></div><div class="row"><span id="who" class="pill">Acesso restrito</span><button id="logout" class="secondary hidden">Sair</button></div></header>
<main><div id="setup" class="card login hidden"><h1>Configuração inicial</h1><p>Preencha o arquivo <code>config.js</code> com a URL e a chave <strong>publishable</strong> do seu projeto Supabase. Não use chave secreta.</p></div><section id="login" class="card login hidden"><h1>Bem-vindo à Torres</h1><p class="muted">Entre com sua conta de colaborador.</p><form id="loginForm"><label class="field">E-mail<input id="email" type="email" required autocomplete="username"></label><label class="field">Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit" style="width:100%">Entrar</button></form><p id="loginError" class="muted"></p></section>
<div id="app" class="layout hidden"><nav id="nav"><button data-page="home" class="active">Visão geral</button><button data-page="production">Minha produção</button><button data-page="training">Treinamentos</button><button data-page="pops">POPs</button><button data-page="processes">Processos</button><button data-page="products">Produtos</button><button data-page="inventory">Estoque</button><button data-page="services">Serviços e planos</button><button data-page="admin" id="adminTab" class="hidden">Gestão da equipe</button></nav><section id="content"></section></div></main><div id="toast" role="status"></div><script src="config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.TORRES_CONFIG||{};const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let sb,me,profile,page='home',isAdmin=false;const toast=s=>{let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4500)};
if(!cfg.url||!cfg.publishableKey||cfg.url.includes('SEU-PROJETO')){$('#setup').classList.remove('hidden')}else{sb=createClient(cfg.url,cfg.publishableKey);init()}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);else $('#login').classList.remove('hidden');sb.auth.onAuthStateChange(async(e,session)=>{if(e==='SIGNED_OUT'){location.reload()}})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='Entrando...';const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent='Não foi possível entrar. Confira e-mail e senha.';return}await enter(data.user)};
$('#logout').onclick=()=>sb.auth.signOut();
async function enter(user){me=user;const {data,error}=await sb.from('profiles').select('id,name,role').eq('id',user.id).single();if(error||!data){$('#login').classList.remove('hidden');$('#loginError').textContent='Conta sem perfil autorizado. Procure o administrador.';return}profile=data;isAdmin=data.role==='admin';$('#who').textContent=data.name||'Colaborador';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#adminTab').classList.toggle('hidden',!isAdmin);await render()}
$('#nav').onclick=async e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));await render()};
async function query(table,select='*',order){let q=sb.from(table).select(select);if(order)q=q.order(order);const {data,error}=await q;if(error){toast('Erro ao consultar '+table);return []}return data||[]}
const heading=(t,desc='')=>`<div class="section-head"><div><h1>${t}</h1><p class="muted">${desc}</p></div></div>`;
async function render(){const el=$('#content');el.innerHTML='<div class="card">Carregando...</div>';if(page==='home')return home(el);if(page==='production')return production(el);if(page==='training')return listing(el,'lessons','Treinamentos','Videoaulas da equipe');if(page==='pops')return listing(el,'pops','Procedimentos operacionais','Orientações e padrões da Torres');if(page==='processes')return listing(el,'processes','Processos','Rotinas e atendimento');if(page==='products')return products(el);if(page==='inventory')return inventory(el);if(page==='services')return services(el);if(page==='admin')return admin(el)}
async function monthly(){const month=new Date().toISOString().slice(0,7)+'-01';const {data,error}=await sb.from('monthly_performance').select('*').eq('month',month).eq('barber_id',me.id).maybeSingle();return error?null:data}
async function home(el){const m=await monthly();const nums=m||{};const pct=Math.min(100,Number(nums.progress_percentage||0));el.innerHTML=heading('Olá, '+safe(profile.name||'equipe')+'!','Seu espaço de organização e desenvolvimento.')+`<div class="card"><h2>Meta do mês</h2>${m?`<div class="section-head"><strong style="font-size:26px;color:#064630">${money(m.total_revenue)}</strong><span class="muted">Meta: ${money(m.revenue_target)}</span></div><p class="muted">${Number(m.progress_percentage||0).toFixed(1)}% atingido · Faltam ${money(m.revenue_remaining)}</p><div class="progress"><div style="width:${pct}%"></div></div>`:'<div class="notice">Meta ainda não cadastrada para este mês. O Torres poderá definir depois.</div>'}</div><br><div class="grid">${[['Atendimentos',nums.total_appointments],['Serviços',nums.total_services],['Extras',nums.total_extras],['Produtos',nums.total_products]].map(([n,v])=>`<div class="metric"><span class="muted">${n}</span><strong>${Number(v||0)}</strong></div>`).join('')}</div><br><div class="card"><h2>Acesso rápido</h2><p>Consulte os procedimentos e registre a produção diária no menu.</p><button class="primary" id="goProd">Registrar produção</button></div>`;$('#goProd').onclick=()=>{$('button[data-page="production"]').click()}}
async function production(el){const today=new Date().toLocaleDateString('en-CA');const [sv,pr]=await Promise.all([query('services','id,name,price_team,price_torres,active','name'),query('products','id,name,active','name')]);el.innerHTML=heading('Minha produção','Registre a quantidade de clientes e o que foi realizado no dia.')+`<div class="card"><form id="prodForm"><div class="row"><label class="field grow">Data<input id="prodDate" type="date" value="${today}" required></label><label class="field grow">Clientes atendidos<input id="appointments" type="number" min="0" step="1" value="0" required></label></div><h2>Serviços realizados</h2><p class="muted">Cabelo + barba conta como 2 serviços, mas o valor do combo é registrado uma vez.</p><div id="serviceInputs" class="list">${sv.filter(x=>x.active).map(x=>`<div class="item row"><div class="grow"><strong>${safe(x.name)}</strong><div class="muted">Preço padrão: ${money(x.price_team??x.price_torres)}</div></div><label>Qtd.<input style="width:76px" type="number" min="0" value="0" data-sid="${x.id}"></label><label>Valor unit. (R$)<input style="width:105px" type="number" min="0" step="0.01" value="${x.price_team??x.price_torres??0}" data-price="${x.id}"></label></div>`).join('')}</div><h2>Produtos vendidos</h2><p class="muted">Cadastre os produtos reais no catálogo antes de registrar vendas. Os preços de produtos são informados manualmente nesta versão.</p><div class="list">${pr.filter(x=>x.active).map(x=>`<div class="item row"><strong class="grow">${safe(x.name)}</strong><label>Qtd.<input style="width:76px" type="number" min="0" value="0" data-pid="${x.id}"></label><label>Valor unit. (R$)<input style="width:105px" type="number" min="0" step="0.01" value="0" data-pprice="${x.id}"></label></div>`).join('')||'<div class="notice">Nenhum produto ativo cadastrado ainda.</div>'}</div><br><button class="primary" type="submit">Salvar produção do dia</button></form><div id="prodMsg" class="muted"></div></div>`;$('#prodForm').onsubmit=async e=>{e.preventDefault();const date=$('#prodDate').value;const count=Number($('#appointments').value);const {data:day,error:err}=await sb.from('daily_production').upsert({barber_id:me.id,production_date:date,appointments:count},{onConflict:'barber_id,production_date'}).select('id').single();if(err)return toast('Não foi possível salvar os atendimentos.');let errors=[];for(const x of document.querySelectorAll('[data-sid]')){const qty=Number(x.value);const id=x.dataset.sid;const price=Number(document.querySelector(`[data-price="${id}"]`).value);if(qty<0||price<0)continue;const {error}=await sb.from('daily_services').upsert({daily_production_id:day.id,service_id:id,quantity:qty,unit_price:price},{onConflict:'daily_production_id,service_id'});if(error)errors.push('serviços')};for(const x of document.querySelectorAll('[data-pid]')){const qty=Number(x.value),id=x.dataset.pid,price=Number(document.querySelector(`[data-pprice="${id}"]`).value);const {error}=await sb.from('daily_product_sales').upsert({daily_production_id:day.id,product_id:id,quantity:qty,unit_price:price},{onConflict:'daily_production_id,product_id'});if(error)errors.push('produtos')};toast(errors.length?'Atendimentos salvos, mas houve erro em '+[...new Set(errors)].join(' e '):'Produção registrada!');$('#prodMsg').textContent='Confira seu painel após salvar.'}}
async function listing(el,table,title,desc){const rows=await query(table,'*','position');el.innerHTML=heading(title,desc)+`<div class="card list">${rows.filter(x=>isAdmin||x.published).map(x=>`<article class="item"><div class="row"><h3 class="grow">${safe(x.title)}</h3>${x.published?'<span class="tag">Publicado</span>':'<span class="muted">Rascunho</span>'}</div><p>${safe(x.description||'Conteúdo em preparação.')}</p>${x.content?`<p style="white-space:pre-wrap">${safe(x.content)}</p>`:''}${x.video_url?`<a href="${safe(x.video_url)}" target="_blank" rel="noopener">Assistir vídeo</a>`:''}</article>`).join('')||'<p>Nenhum conteúdo publicado ainda.</p>'}</div>`}
async function products(el){const rows=await query('products','*','position');el.innerHTML=heading('Produtos','Informações e orientações para a equipe.')+`<div class="card list">${rows.filter(x=>isAdmin||x.active).map(x=>`<div class="item"><div class="row"><h3 class="grow">${safe(x.name)}</h3><span class="tag">${safe(x.product_category)}</span></div><p>${safe(x.description||'Detalhes ainda não cadastrados.')}</p>${x.how_to_use?`<p><strong>Como usar:</strong> ${safe(x.how_to_use)}</p>`:''}</div>`).join('')||'<p>Nenhum produto disponível.</p>'}</div>`}
async function inventory(el){const {data,error}=await sb.from('inventory').select('product_id,status,products(name,active)').order('updated_at',{ascending:false});const rows=data||[];el.innerHTML=heading('Estoque','Consulte a disponibilidade e sinalize itens que estão acabando.')+`<div class="card list">${rows.filter(x=>isAdmin||x.products?.active).map(x=>`<div class="item row"><div class="grow"><strong>${safe(x.products?.name)}</strong><div class="muted">Status: ${safe(x.status)} · confirmar estoque físico</div></div><button class="secondary" data-stock="${x.product_id}" data-status="baixo">Estoque baixo</button><button class="secondary" data-stock="${x.product_id}" data-status="em_falta">Em falta</button></div>`).join('')||'<p>Nenhum item.</p>'}</div>`;el.onclick=async e=>{const b=e.target.closest('[data-stock]');if(!b)return;const {error}=await sb.rpc('sinalizar_estoque',{p_product_id:b.dataset.stock,p_status:b.dataset.status});toast(error?'Não foi possível sinalizar o estoque.':'Estoque sinalizado.');if(!error)inventory(el)}}
async function services(el){const [sv,plans]=await Promise.all([query('services','*','position'),query('plans','*','position')]);el.innerHTML=heading('Serviços e planos','Tabela de referência para a equipe.')+`<div class="card"><h2>Serviços</h2><table><thead><tr><th>Serviço</th><th>Equipe</th><th>Torres</th></tr></thead><tbody>${sv.filter(x=>x.active).map(x=>`<tr><td>${safe(x.name)}</td><td>${x.price_team==null?'—':money(x.price_team)}</td><td>${x.price_torres==null?'—':money(x.price_torres)}</td></tr>`).join('')}</tbody></table><h2>Assinaturas</h2><div class="list">${plans.filter(x=>x.active).map(x=>`<div class="item"><strong>${safe(x.name||x.plan_type+' · '+x.service_type)}</strong><span style="float:right">${money(x.monthly_price)}/mês</span></div>`).join('')}</div></div>`}
async function admin(el){if(!isAdmin){el.innerHTML='Acesso restrito';return}const [people,monthly]=await Promise.all([query('profiles','id,name,role','name'),query('monthly_performance','*','barber_name')]);el.innerHTML=heading('Gestão da equipe','Acompanhe os colaboradores e as metas cadastradas.')+`<div class="card"><h2>Equipe</h2><table><thead><tr><th>Nome</th><th>Função</th><th>Meta atual</th><th>Faturamento</th></tr></thead><tbody>${people.map(x=>{const m=monthly.find(v=>v.barber_id===x.id&&v.month===new Date().toISOString().slice(0,7)+'-01');return `<tr><td>${safe(x.name)}</td><td>${safe(x.role)}</td><td>${m?money(m.revenue_target):'Não definida'}</td><td>${m?money(m.total_revenue):'—'}</td></tr>`}).join('')}</tbody></table><div class="notice">Cadastro e edição de metas, conteúdos e preços serão adicionados na próxima versão. Nesta etapa, o painel permite visualizar os registros existentes.</div></div>`}
</script></body></html>
